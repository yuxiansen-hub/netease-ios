name: build-apk

on:
  workflow_dispatch:
  push:
    # 工程放在 yuxiansen-hub/netease-ios 的独立分支上（本机 token 只有这一个仓库的权限，
    # 且新建仓库需要 Administration 权限）。分支是 orphan，不含网易云代码。
    branches: [opencode-app]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

env:
  SDK_PLATFORM: platforms;android-35
  BUILD_TOOLS: 35.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "$SDK_PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "缺少 KEYSTORE_B64 secret"; exit 1; }
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "app=$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          sha256sum "$APK" | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-twa-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/certs.txt
            android/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
